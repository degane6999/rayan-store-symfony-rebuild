security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt
            cost: 12

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/seller, roles: ROLE_SELLER }
        - { path: ^/(cart|checkout|orders?|account), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: bcrypt
                cost: 4

when@perf:
    # ONLY used by the local load-testing harness, where every simulated client
    # connects from the same loopback IP and would otherwise trip real login
    # throttling within seconds. The real dev/test/prod throttling (5/minute)
    # above is untouched.
    security:
        firewalls:
            main:
                login_throttling:
                    max_attempts: 100000
