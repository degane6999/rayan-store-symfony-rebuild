# Nginx devant PHP-FPM (production).
# HTTPS est terminé par le reverse proxy de l'hébergeur (Traefik, Caddy, ou Nginx + Let's Encrypt).
server {
    listen 80;
    server_name _;
    root /var/www/app/public;
    server_tokens off;

    # En-têtes de sécurité (OWASP A05)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # À activer une fois le site servi uniquement en HTTPS :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy : à ajouter quand Tailwind sera compilé localement (aujourd'hui chargé par CDN).

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul le front controller est exécuté par PHP.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        internal;
    }

    # Tout autre fichier .php est refusé.
    location ~ \.php$ {
        return 404;
    }
}
