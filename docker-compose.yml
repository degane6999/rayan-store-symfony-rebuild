services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: rayan_store
      MARIADB_USER: rayan
      MARIADB_PASSWORD: rayan
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://rayan:rayan@db:3306/rayan_store?serverVersion=10.11.6-MariaDB&charset=utf8mb4"
    ports:
      - "8000:8000"
    command: >
      sh -c "
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php bin/console app:seed &&
        php -S 0.0.0.0:8000 -t public
      "

volumes:
  db_data:
