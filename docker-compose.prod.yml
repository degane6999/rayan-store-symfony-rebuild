# Déploiement de production — voir DEPLOIEMENT.md
#   docker compose --env-file .env.prod.local -f docker-compose.prod.yml up -d --build
# Les secrets viennent de .env.prod.local (ignoré par Git), jamais de ce fichier.

# Nom de projet distinct : les conteneurs et le volume de production ne se
# mélangent jamais avec ceux de développement (docker-compose.yml).
name: rayan-store-prod

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: rayan_store
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Pas de section "ports" : la base n'est joignable que par le réseau interne Docker.

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/rayan_store?serverVersion=10.11.0-MariaDB&charset=utf8mb4"
      MAILER_DSN: ${MAILER_DSN}

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # 80 sur le serveur ; un autre port (8080) pour un essai sur votre PC
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
